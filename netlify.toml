# Netlify preview of the new twinlink.eu site. Hidden from search engines (PUBLIC_PREVIEW).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUBLIC_PREVIEW = "true"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
